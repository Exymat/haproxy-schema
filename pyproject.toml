[project]
name = "haproxy-schema"
version = "0.1.0"
description = "Build HAProxy schemas, language data, and TextMate grammars from configuration.txt and dkall dumps"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
haproxy-schema = "haproxy_schema.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haproxy_schema"]
artifacts = ["haproxy_schema/curated_metadata/*.json"]

[tool.pytest.ini_options]
testpaths = ["haproxy_schema/tests"]
addopts = [
    "--cov=haproxy_schema",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
]

[tool.coverage.run]
source = ["haproxy_schema"]
omit = ["haproxy_schema/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "raise AssertionError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
